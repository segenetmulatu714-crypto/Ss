<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LuxeStay Hotel Booking</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .hotel-hero { text-align: center; padding: 80px 20px; background: #DDE2E5; border-radius: 0 0 40px 40px;}
    .search-bar { background: white; padding: 20px; border-radius: 20px; max-width: 800px; margin: -30px auto 40px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); display: flex; gap: 10px; justify-content: center;}
    .search-bar input { padding: 10px; border: 1px solid #ccc; border-radius: 10px; width: 100%;}
  </style>
</head>
<body>
  <div class="hotel-hero">
    <h1>Find Your Perfect Room</h1>
    <p>Real-time availability and dynamic pricing algorithms.</p>
    <a href="index.html" class="btn btn-secondary" style="margin-top:20px;">&larr; Back to Portfolio</a>
  </div>
  
  <div class="search-bar">
    <input type="text" placeholder="Check-in Date" disabled>
    <input type="text" placeholder="Check-out Date" disabled>
    <button class="btn btn-primary">Search API</button>
  </div>

  <div class="wrapper" style="text-align: center; padding-bottom: 50px;">
    <p><em>This project demonstrates RESTful API integration, user authentication (JWT), and a React frontend for filtering hotel rooms by price, rating, and amenities.</em></p>
  </div>
</body>
</html>
