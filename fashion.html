<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Z_ናጭ Fashion | Collections</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .page-header { text-align: center; padding: 60px 20px; background: #EAE6DF; border-radius: 0 0 40px 40px;}
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 40px 20px; max-width: 1000px; margin: auto; }
    .gallery-item { border-radius: 20px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
    .gallery-item img { width: 100%; height: 300px; object-fit: cover; transition: 0.3s; }
    .gallery-item:hover img { transform: scale(1.05); }
    .item-details { padding: 15px; background: white; text-align: center; }
    .back-btn { margin-top: 20px; display: inline-block; }
  </style>
</head>
<body>
  <div class="page-header">
    <h1>Z_ናጭ Fashion Collections</h1>
    <p>Discover our latest summer and winter clothing lines.</p>
    <a href="index.html" class="btn btn-secondary back-btn">&larr; Back to Portfolio</a>
  </div>

  <div class="gallery">
    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=400&q=80" alt="Fashion 1">
      <div class="item-details"><h3>Urban Chic</h3></div>
    </div>
    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=400&q=80" alt="Fashion 2">
      <div class="item-details"><h3>Summer Vintage</h3></div>
    </div>
    <div class="gallery-item">
      <img src="https://images.unsplash.com/photo-1550614000-4b95d4662dcd?auto=format&fit=crop&w=400&q=80" alt="Fashion 3">
      <div class="item-details"><h3>Evening Wear</h3></div>
    </div>
  </div>
</body>
</html>
